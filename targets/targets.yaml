defaults:
  arch: x86_64
  os_family: rhel
targets:
  rocky8:
    configure_args:
    - --enable-gss=yes
    - --enable-crypto=yes
    # Note: fscrypt userspace never landed in EPEL8 (see
    # rocky8/image.Dockerfile), so encryption tests that drive the
    # fscrypt tool still skip here -- but the client_encryption
    # connect flag (sanity-sec test_54's gate) works.
    container_image: quay.io/rockylinux/rockylinux:8.10
    kernels:
      available:
      - 4.18-rhel8.10
      - 4.18-rhel8.9
      - 4.18-rhel8.8
      - 4.18-rhel8.7
      - 4.18-rhel8.6
      - 4.18-rhel8.5
      - 4.18-rhel8.4
      config:
        CONFIG_XEN_PVH: y
      default: 4.18-rhel8.10
    lustre:
      mode: server_ldiskfs
    os_name: rocky
    os_version: '8.10'
    srpm_url: https://dl.rockylinux.org/pub/rocky/8/BaseOS/source/tree/Packages/k
    status: working
    # Version `--zfs` builds for this target.  Declaring it does not
    # turn ZFS on; it only says which release to use when asked.
    # 2.3.x rather than the 2.4.0 lustre/ChangeLog recommends: 2.4
    # dropped support for the 4.18 EL8 kernel.
    zfs:
      version: 2.3.4
  rocky9:
    # No configure_args: the build container has no Kerberos v5, so
    # --enable-gss makes configure fail with "Kerberos v5 with GSS
    # support not found".  ltvm's base is --disable-gss
    # --disable-crypto, which is what this target wants.
    container_image: quay.io/rockylinux/rockylinux:9
    kernels:
      available:
      - 5.14-rhel9.8
      - 5.14-rhel9.7
      - 5.14-rhel9.6
      - 5.14-rhel9.5
      - 5.14-rhel9.4
      - 5.14-rhel9.3
      - 5.14-rhel9.2
      - 5.14-rhel9.1
      config:
        CONFIG_XEN_PVH: y
      default: 5.14-rhel9.7
    lustre:
      mode: server_ldiskfs
    os_name: rocky
    os_version: '9.7'
    srpm_url: https://dl.rockylinux.org/pub/rocky/9/BaseOS/source/tree/Packages/k
    status: working
    # Version `--zfs` builds for this target.  Declaring it does not
    # turn ZFS on; it only says which release to use when asked.
    # Tracks the "Recommended ZFS version" line in lustre/ChangeLog.
    zfs:
      version: 2.4.0
    variants:
      mofed-24:
        container_overlay: rocky9/variants/mofed-24.container.Dockerfile
        image_overlay: rocky9/variants/mofed-24.image.Dockerfile
        # MOFED 24.10-2.1.8.0's source predates rhel9.7's backport of
        # the NETIF_F_NETNS_LOCAL netdev-feature removal, so its kmods
        # won't compile against the rhel9.7 kernel.  Pin the variant
        # to rhel9.5 (which the bundle officially targets) until
        # NVIDIA ships a rhel9.7-compatible MOFED -- which will land
        # as a separate ``mofed-25`` variant alongside this one.
        kernel: 5.14-rhel9.5
        params:
          mofed_version: 24.10-2.1.8.0
          mofed_distro: rhel9.5
  # 64 KiB-page aarch64 client, to reproduce the customer ARM config
  rocky9-64k:
    # Explicit: CONFIG_ARM64_64K_PAGES is the whole point of this
    # target and is a no-op anywhere else, so it must not inherit the
    # x86_64 default.  Also what keeps it from colliding with rocky9
    # when an unstamped machine is identified from /etc/os-release.
    arch: aarch64
    container_image: quay.io/rockylinux/rockylinux:9
    kernels:
      available:
      - 5.14-rhel9.8
      - 5.14-rhel9.7
      - 5.14-rhel9.6
      - 5.14-rhel9.5
      - 5.14-rhel9.4
      - 5.14-rhel9.3
      - 5.14-rhel9.2
      - 5.14-rhel9.1
      config:
        CONFIG_XEN_PVH: y
        CONFIG_ARM64_64K_PAGES: y
        CONFIG_ARM64_4K_PAGES: n
        CONFIG_ARM64_16K_PAGES: n
      default: 5.14-rhel9.7
    lustre:
      mode: server_ldiskfs
    os_name: rocky
    os_version: '9.7'
    srpm_url: https://dl.rockylinux.org/pub/rocky/9/BaseOS/source/tree/Packages/k
    status: working
    zfs:
      version: 2.4.0
  rocky10:
    configure_args:
    - --enable-gss=yes
    - --enable-crypto=yes
    container_image: quay.io/rockylinux/rockylinux:10.1
    default_mem: 4096
    kernels:
      available:
      - 6.12-rhel10.2
      - 6.12-rhel10.1
      # Lustre's 6.12-rhel10.0.target declares 55.43.1.el10_0, but
      # Rocky never mirrored that rebuild -- vault/rocky/10.0 tops out
      # at 55.41.1 (verified 2026-08).  Do NOT "fix" this pin to
      # 55.43.1: it does not exist on pub or vault, and the published
      # release rocky10-aarch64-6.12.0-55.41.1.el10_0_lustre depends
      # on this exact version.
      - name: 6.12-rhel10.0
        srpm_version: 6.12.0-55.41.1.el10_0
      config:
        CONFIG_XEN_PVH: y
        # Soft-RoCE, for RDMA testing without RDMA hardware.  RHEL
        # deprecated rxe in 9 and ships it disabled in 10, so every
        # stock rocky10 kernel has "# CONFIG_RDMA_RXE is not set" --
        # unlike rocky8/rocky9, which carry it as =m.  Without this,
        # `rdma link add ... type rxe` has no driver to bind and the
        # softroce path ltvm otherwise relies on is silently
        # unavailable on this target.  The driver is upstream in 6.12;
        # Red Hat disabled it by policy, not because it is broken.
        CONFIG_RDMA_RXE: m
      default: 6.12-rhel10.0
    lustre:
      mode: server_ldiskfs
    os_name: rocky
    os_version: '10.1'
    srpm_url: https://dl.rockylinux.org/pub/rocky/10/BaseOS/source/tree/Packages/k
    status: working
    zfs:
      version: 2.4.0
  # Vanilla kernel.org kernels on a Rocky 10 userspace.  Exists to get
  # Lustre building and running against mainline before any distro
  # ships it -- so it is expected to be ahead of lustre/ChangeLog, and
  # the compat gate warns rather than refusing for kernels newer than
  # anything Lustre lists (see lustre_compat.validate_target).
  #
  # server_ldiskfs, not client: Lustre ships ldiskfs series for vanilla
  # kernels (ldiskfs-6.18-ml, ldiskfs-7.0-ml, ...) and its configure
  # maps any kernel >= 6.19 onto 7.0-ml.  lustre_compat's
  # vanilla_ldiskfs_series() is a port of that ladder.
  #
  # Kernels are specs, not versions -- see ltvm_pkg/upstream_kernel.py.
  # `latest` and the monikers move whenever kernel.org publishes, and
  # the version each resolved to is folded into the kernel staleness
  # hash so a moved alias rebuilds instead of reusing a stale vmlinux.
  mainline:
    container_image: quay.io/rockylinux/rockylinux:10.1
    default_mem: 4096
    kernel_upstream:
      releases_url: https://www.kernel.org/releases.json
    kernels:
      available:
      # Moving aliases, resolved against kernel.org at build time.
      - latest      # newest mainline -rc == closest tag to Linus HEAD
      - stable      # newest stable release
      - longterm    # newest longterm release
      # Series pins -- newest point release kernel.org lists for each.
      - '7.0'
      - '6.18'
      config:
        CONFIG_XEN_PVH: y
      # `stable` rather than `latest`: the default build should be a
      # finished release.  Ask for `latest` explicitly to chase -rcs.
      default: stable
    lustre:
      mode: server_ldiskfs
    os_family: rhel
    os_name: rocky
    os_version: '10.1'
    status: experimental
    zfs:
      version: 2.4.0
  ubuntu2404:
    # --with-o2ib=no is NOT needed here: it has been hard-coded in the
    # base configure line (lustre_build.py) for every target since
    # 9653316.
    container_image: docker.io/library/ubuntu:24.04
    kernel_deb_source: linux-source-6.8.0
    kernels:
      available:
      - 6.8-ubuntu2404
      config:
        CONFIG_PVH: y
      default: 6.8-ubuntu2404
    lustre:
      mode: client
    os_family: debian
    os_name: ubuntu
    os_version: '24.04'
    status: working
