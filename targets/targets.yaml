defaults:
  arch: x86_64
  os_family: rhel
targets:
  rocky8:
    configure_args:
    - --enable-gss=yes
    - --enable-crypto=yes
    # Note: fscrypt userspace never landed in EPEL8 (see
    # rocky8/image.Dockerfile), so encryption tests that drive the
    # fscrypt tool still skip here -- but the client_encryption
    # connect flag (sanity-sec test_54's gate) works.
    container_image: quay.io/rockylinux/rockylinux:8.10
    kernels:
      available:
      - 4.18-rhel8.10
      - 4.18-rhel8.9
      - 4.18-rhel8.8
      - 4.18-rhel8.7
      - 4.18-rhel8.6
      - 4.18-rhel8.5
      - 4.18-rhel8.4
      config:
        CONFIG_XEN_PVH: y
        # EL8's SMC sources do not build outside s390x (553.177.1 prints
        # an s64 with %ld under -Werror), so rocky8 kernels go without
        # SMC; shmrdma works without it.
        CONFIG_SMC: null
        CONFIG_SMC_DIAG: null
        CONFIG_SMC_LO: null
      arch_config:
        aarch64:
          # EPEL8's aarch64 cross gcc is GCC 12, which fails a FIELD_FIT
          # BUILD_BUG_ON in nfp/bpf/jit.c that EL8's GCC 8 does not (fixed
          # upstream in 5.9 by 444da3f52407).
          CONFIG_NFP: n
      default: 4.18-rhel8.10
    lustre:
      mode: server_ldiskfs
    os_name: rocky
    os_version: '8.10'
    srpm_url: https://dl.rockylinux.org/pub/rocky/8/BaseOS/source/tree/Packages/k
    status: working
    # Version `--zfs` builds for this target.  Declaring it does not
    # turn ZFS on; it only says which release to use when asked.
    # 2.3.x rather than the 2.4.0 lustre/ChangeLog recommends: 2.4
    # dropped support for the 4.18 EL8 kernel.
    zfs:
      version: 2.3.4
  rocky9:
    # No configure_args: the build container has no Kerberos v5, so
    # --enable-gss makes configure fail with "Kerberos v5 with GSS
    # support not found".  ltvm's base configure line has
    # --disable-gss and leaves client crypto on.
    container_image: quay.io/rockylinux/rockylinux:9
    kernels:
      available:
      - 5.14-rhel9.8
      - 5.14-rhel9.7
      - 5.14-rhel9.6
      - 5.14-rhel9.5
      - 5.14-rhel9.4
      - 5.14-rhel9.3
      - 5.14-rhel9.2
      - 5.14-rhel9.1
      config:
        CONFIG_XEN_PVH: y
      default: 5.14-rhel9.7
    lustre:
      mode: server_ldiskfs
    os_name: rocky
    os_version: '9.7'
    srpm_url: https://dl.rockylinux.org/pub/rocky/9/BaseOS/source/tree/Packages/k
    status: working
    # Version `--zfs` builds for this target.  Declaring it does not
    # turn ZFS on; it only says which release to use when asked.
    # Tracks the "Recommended ZFS version" line in lustre/ChangeLog.
    zfs:
      version: 2.4.0
    variants:
      mofed-24:
        container_overlay: rocky9/variants/mofed-24.container.Dockerfile
        image_overlay: rocky9/variants/mofed-24.image.Dockerfile
        # MOFED 24.10-2.1.8.0's source predates rhel9.7's backport of
        # the NETIF_F_NETNS_LOCAL netdev-feature removal, so its kmods
        # won't compile against the rhel9.7 kernel.  Pin the variant
        # to rhel9.5 (which the bundle officially targets) until
        # NVIDIA ships a rhel9.7-compatible MOFED -- which will land
        # as a separate ``mofed-25`` variant alongside this one.
        kernel: 5.14-rhel9.5
        params:
          mofed_version: 24.10-2.1.8.0
          mofed_distro: rhel9.5
      # SELinux enforcing (targeted policy), for sanity-selinux.  Image
      # only; the first boot relabels the root filesystem and reboots.
      selinux:
        image_overlay: rocky9/variants/selinux.image.Dockerfile
  # 64 KiB-page aarch64 client, to reproduce the customer ARM config
  rocky9-64k:
    # Explicit: CONFIG_ARM64_64K_PAGES is the whole point of this
    # target and is a no-op anywhere else, so it must not inherit the
    # x86_64 default.  Also what keeps it from colliding with rocky9
    # when an unstamped machine is identified from /etc/os-release.
    arch: aarch64
    container_image: quay.io/rockylinux/rockylinux:9
    kernels:
      available:
      - 5.14-rhel9.8
      - 5.14-rhel9.7
      - 5.14-rhel9.6
      - 5.14-rhel9.5
      - 5.14-rhel9.4
      - 5.14-rhel9.3
      - 5.14-rhel9.2
      - 5.14-rhel9.1
      config:
        CONFIG_XEN_PVH: y
        CONFIG_ARM64_64K_PAGES: y
        CONFIG_ARM64_4K_PAGES: n
        CONFIG_ARM64_16K_PAGES: n
      default: 5.14-rhel9.7
    lustre:
      mode: server_ldiskfs
    os_name: rocky
    os_version: '9.7'
    srpm_url: https://dl.rockylinux.org/pub/rocky/9/BaseOS/source/tree/Packages/k
    status: working
    zfs:
      version: 2.4.0
  rocky10:
    configure_args:
    - --enable-gss=yes
    - --enable-crypto=yes
    container_image: quay.io/rockylinux/rockylinux:10.1
    default_mem: 4096
    kernels:
      available:
      - 6.12-rhel10.2
      - 6.12-rhel10.1
      # Lustre's 6.12-rhel10.0.target declares 55.43.1.el10_0, but
      # Rocky never mirrored that rebuild -- vault/rocky/10.0 tops out
      # at 55.41.1 (verified 2026-08).  Do NOT "fix" this pin to
      # 55.43.1: it does not exist on pub or vault, and the published
      # release rocky10-aarch64-6.12.0-55.41.1.el10_0_lustre depends
      # on this exact version.
      - name: 6.12-rhel10.0
        srpm_version: 6.12.0-55.41.1.el10_0
      config:
        CONFIG_XEN_PVH: y
        # Soft-RoCE, for RDMA testing without RDMA hardware.  RHEL
        # deprecated rxe in 9 and ships it disabled in 10, so every
        # stock rocky10 kernel has "# CONFIG_RDMA_RXE is not set" --
        # unlike rocky8/rocky9, which carry it as =m.  Without this,
        # `rdma link add ... type rxe` has no driver to bind and the
        # softroce path ltvm otherwise relies on is silently
        # unavailable on this target.  The driver is upstream in 6.12;
        # Red Hat disabled it by policy, not because it is broken.
        CONFIG_RDMA_RXE: m
      default: 6.12-rhel10.0
    lustre:
      mode: server_ldiskfs
    os_name: rocky
    os_version: '10.1'
    variants:
      # GCE guest agent, for images exported with --format gce.  Image
      # only: the kernel and Lustre are the base target's, unchanged.
      gce:
        image_overlay: rocky10/variants/gce.image.Dockerfile
    srpm_url: https://dl.rockylinux.org/pub/rocky/10/BaseOS/source/tree/Packages/k
    status: working
    zfs:
      version: 2.4.0
  # 16 KiB-page aarch64, the largest page size Apple Silicon HVF can
  # run natively (it has only the 4K and 16K translation granules, so
  # rocky9-64k needs LTVM_FORCE_TCG there).  For finding Lustre
  # PAGE_SIZE > 4 KiB bugs at full speed on an Apple Silicon host.
  # Pair it with rocky10 on the same kernel as the 4 KiB baseline.
  rocky10-16k:
    # Explicit, as for rocky9-64k: the page-size options are a no-op
    # anywhere else, and the arch keeps it from matching rocky10 when
    # an unstamped machine is identified from /etc/os-release.
    arch: aarch64
    configure_args:
    - --enable-gss=yes
    - --enable-crypto=yes
    container_image: quay.io/rockylinux/rockylinux:10.1
    default_mem: 4096
    kernels:
      available:
      - 6.12-rhel10.2
      - 6.12-rhel10.1
      config:
        CONFIG_XEN_PVH: y
        CONFIG_RDMA_RXE: m
        # After kernel-config-aarch64.fragment's 4K, so these win.
        CONFIG_ARM64_16K_PAGES: y
        CONFIG_ARM64_4K_PAGES: n
        CONFIG_ARM64_64K_PAGES: n
      default: 6.12-rhel10.2
    lustre:
      mode: server_ldiskfs
    os_name: rocky
    os_version: '10.1'
    srpm_url: https://dl.rockylinux.org/pub/rocky/10/BaseOS/source/tree/Packages/k
    status: experimental
    zfs:
      version: 2.4.0
  # Vanilla kernel.org kernels on a Rocky 10 userspace.  Exists to get
  # Lustre building and running against mainline before any distro
  # ships it -- so it is expected to be ahead of lustre/ChangeLog, and
  # the compat gate warns rather than refusing for kernels newer than
  # anything Lustre lists (see lustre_compat.validate_target).
  #
  # server_ldiskfs, not client: Lustre ships ldiskfs series for vanilla
  # kernels (ldiskfs-6.18-ml, ldiskfs-7.0-ml, ...) and its configure
  # maps any kernel >= 6.19 onto 7.0-ml.  lustre_compat's
  # vanilla_ldiskfs_series() is a port of that ladder.
  #
  # Kernels are specs, not versions -- see ltvm_pkg/upstream_kernel.py.
  # `latest` and the monikers move whenever kernel.org publishes, and
  # the version each resolved to is folded into the kernel staleness
  # hash so a moved alias rebuilds instead of reusing a stale vmlinux.
  mainline:
    container_image: quay.io/rockylinux/rockylinux:10.1
    default_mem: 4096
    kernel_upstream:
      releases_url: https://www.kernel.org/releases.json
    kernels:
      available:
      # Moving aliases, resolved against kernel.org at build time.
      - latest      # newest mainline -rc == closest tag to Linus HEAD
      - stable      # newest stable release
      - longterm    # newest longterm release
      # Series pins -- newest point release kernel.org lists for each.
      - '7.0'
      - '6.18'
      config:
        CONFIG_XEN_PVH: y
      # `stable` rather than `latest`: the default build should be a
      # finished release.  Ask for `latest` explicitly to chase -rcs.
      default: stable
    lustre:
      mode: server_ldiskfs
    os_family: rhel
    os_name: rocky
    os_version: '10.1'
    status: experimental
    zfs:
      version: 2.4.0
  # SLES 15 kernels on an openSUSE Leap 15.6 userspace, for Lustre
  # clients.  Public SLES kernel SRPMs are scarce, but SUSE publishes
  # each released kernel as an rpm-<version>-<release> tag in two
  # GitHub repositories: SUSE/kernel, the source with series.conf
  # already applied, and SUSE/kernel-source, the patches and configs.
  # The kernel is the former built with the latter's
  # config/<arch>/default, as kernel-binary.spec does, at the lnxrel
  # Lustre's <kernel>.target pins.  Leap 15.6 ships SLE 15's own
  # packages for most of its userspace.
  #
  # client only: Lustre ships no ldiskfs series past SLES 15 SP5, and
  # lustre/ChangeLog lists SLES 15 SP7 as a client primary kernel.
  # SP7 has no Leap release, so the userspace stays at 15.6 (SP6's).
  opensuse156:
    # Leap's openmpi4 is off PATH, where the base configure line's
    # mpicc probe cannot find it
    configure_args:
    - --enable-mpitests=/usr/lib64/mpi/gcc/openmpi4/bin/mpicc
    container_image: registry.opensuse.org/opensuse/leap:15.6
    kernel_suse_source: https://github.com/SUSE
    kernels:
      available:
      - 6.4-sles15sp7
      - 6.4-sles15sp6
      config:
        CONFIG_XEN_PVH: y
        # SUSE builds these kernels with GCC 7 and DWARF 4
        CONFIG_DEBUG_INFO_DWARF4: y
        CONFIG_DEBUG_INFO_DWARF5: n
      default: 6.4-sles15sp7
    lustre:
      mode: client
    os_family: suse
    os_name: opensuse-leap
    os_version: '15.6'
    status: experimental
  ubuntu2404:
    container_image: docker.io/library/ubuntu:24.04
    kernel_deb_source: linux-source-6.8.0
    kernels:
      available:
      - 6.8-ubuntu2404
      config:
        CONFIG_PVH: y
        # Nested KVM, bridges, tun/tap
        CONFIG_VIRTUALIZATION: y
        CONFIG_KVM: m
        CONFIG_KVM_INTEL: m
        CONFIG_KVM_AMD: m
        CONFIG_VHOST_NET: m
        CONFIG_TUN: m
        CONFIG_VETH: m
        CONFIG_MACVLAN: m
        CONFIG_MACVTAP: m
        CONFIG_DUMMY: m
        CONFIG_VLAN_8021Q: m
        CONFIG_BRIDGE_VLAN_FILTERING: y
        # nftables, including the bridge family and socket cgroupv2
        CONFIG_NETFILTER_ADVANCED: y
        CONFIG_NF_CONNTRACK: m
        CONFIG_NF_CONNTRACK_BRIDGE: m
        CONFIG_BRIDGE_NETFILTER: m
        CONFIG_NF_TABLES_INET: y
        CONFIG_NF_TABLES_NETDEV: y
        CONFIG_NF_TABLES_IPV4: y
        CONFIG_NF_TABLES_IPV6: y
        CONFIG_NF_TABLES_ARP: y
        CONFIG_NF_TABLES_BRIDGE: m
        CONFIG_NFT_CT: m
        CONFIG_NFT_NAT: m
        CONFIG_NFT_MASQ: m
        CONFIG_NFT_REDIR: m
        CONFIG_NFT_REJECT: m
        CONFIG_NFT_LOG: m
        CONFIG_NFT_LIMIT: m
        CONFIG_NFT_SOCKET: m
        CONFIG_NFT_FIB_INET: m
        CONFIG_NFT_FIB_IPV4: m
        CONFIG_NFT_FIB_IPV6: m
        CONFIG_NFT_COMPAT: m
        CONFIG_NFT_BRIDGE_META: m
        CONFIG_NFT_BRIDGE_REJECT: m
        CONFIG_NETFILTER_XT_NAT: m
        CONFIG_NETFILTER_XT_TARGET_MASQUERADE: m
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE: m
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK: m
        CONFIG_NETFILTER_XT_MATCH_COMMENT: m
        CONFIG_NETFILTER_XT_MATCH_MULTIPORT: m
        # ufw's rules
        CONFIG_NETFILTER_XT_MATCH_LIMIT: m
        CONFIG_NETFILTER_XT_MATCH_HASHLIMIT: m
        CONFIG_NETFILTER_XT_MATCH_RECENT: m
        CONFIG_NETFILTER_XT_MATCH_HL: m
        CONFIG_NETFILTER_XT_MATCH_PKTTYPE: m
        CONFIG_NETFILTER_XT_MATCH_OWNER: m
        CONFIG_IP6_NF_MATCH_RT: m
        CONFIG_IP6_NF_MATCH_HL: m
        # cgroup v2 with BPF (systemd IPAddressDeny=), namespaces
        CONFIG_CGROUPS: y
        CONFIG_CGROUP_BPF: y
        CONFIG_BPF_SYSCALL: y
        CONFIG_BPF_JIT: y
        CONFIG_MEMCG: y
        CONFIG_CGROUP_PIDS: y
        CONFIG_CPUSETS: y
        CONFIG_BLK_CGROUP: y
        CONFIG_CGROUP_SCHED: y
        CONFIG_PSI: y
        CONFIG_NAMESPACES: y
        CONFIG_USER_NS: y
        CONFIG_SECCOMP: y
        CONFIG_SECCOMP_FILTER: y
        CONFIG_FHANDLE: y
        CONFIG_AUTOFS_FS: y
        CONFIG_TMPFS_POSIX_ACL: y
        CONFIG_TMPFS_XATTR: y
        # Container filesystems
        CONFIG_OVERLAY_FS: m
        CONFIG_FUSE_FS: m
        # Quota, including ext4 and XFS project quota
        CONFIG_QUOTA: y
        CONFIG_QUOTACTL: y
        CONFIG_QFMT_V2: y
        CONFIG_XFS_FS: m
        CONFIG_XFS_QUOTA: y
        CONFIG_XFS_POSIX_ACL: y
      arch_config:
        aarch64:
          # linux-source-6.8.0 6.8.0-149 does not build coresight-catu.c
          # on arm64 (csdev->refcnt became atomic_t, catu still does
          # arithmetic on it); x86 does not build CoreSight.
          CONFIG_CORESIGHT_CATU: n
      default: 6.8-ubuntu2404
    lustre:
      mode: client
    os_family: debian
    os_name: ubuntu
    os_version: '24.04'
    status: working
  # Test bed for services that run their own VMs, containers and
