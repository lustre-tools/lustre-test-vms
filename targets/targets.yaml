  # Ubuntu 26.04 as an ldiskfs server, on the kernel Lustre's
  # ldiskfs-7.0.0-14-ubuntu26 series targets.  Lustre's configure
  # picks an Ubuntu series from the release string's base version and
  # ABI ("7.0.0-14-...") and only when utsrelease.h carries
  # UTS_UBUNTU_RELEASE_ABI; without it the kernel reads as vanilla and
  # gets ldiskfs-7.0-ml.  So the source is pinned to that exact upload
  # (still in the resolute release pocket), CONFIG_LOCALVERSION names
  # the kernel 7.0.0-14-lustre, and the kernel build adds the ABI line
  # Ubuntu's own packaging would (kernel_build._mark_ubuntu_abi).  lustre_compat's
  # ubuntu_ldiskfs_series() is a port of configure's Ubuntu ladder.
  #
  # The Dockerfiles are ubuntu2604's (symlinks); the kernel config is
  # ubuntu2604's plus what a server and its test suites need on top of
  # defconfig.
  ubuntu2604-server:
    container_image: docker.io/library/ubuntu:26.04
    kernel_deb_source: linux-source-7.0.0=7.0.0-14.14
    kernels:
      available:
      - 7.0.0-14-ubuntu26
      config:
        <<: *ubuntu2604_config
        # 7.0.0-14-lustre: configure reads the ABI from the 2nd field
        CONFIG_LOCALVERSION: '"-14-lustre"'
        CONFIG_LOCALVERSION_AUTO: n
        # dm-flakey: the test framework mounts every target through it
        CONFIG_MD: y
        CONFIG_BLK_DEV_DM: m
        CONFIG_DM_FLAKEY: m
        CONFIG_DM_DELAY: m
        CONFIG_DM_SNAPSHOT: m
        CONFIG_BLK_DEV_LOOP: m
        CONFIG_EXT4_FS_POSIX_ACL: y
        CONFIG_EXT4_FS_SECURITY: y
        CONFIG_FS_ENCRYPTION: y
        # what Ubuntu's generic config has and the test suites use
        CONFIG_CRYPTO_CRC32C: y
        CONFIG_ENCRYPTED_KEYS: y
        CONFIG_NFSD: m
        CONFIG_SCSI_DEBUG: m
        CONFIG_BLK_DEV_NULL_BLK: m
      default: 7.0.0-14-ubuntu26
    lustre:
      mode: server_ldiskfs
    os_family: debian
    os_name: ubuntu
    os_version: '26.04'
    status: experimental
  # Debian 13 as an ldiskfs server.  Debian's linux-source package is
  # its patched source, and the config is Debian's own, from the
  # linux-image packages of the same upload (the container stages it).
  # Lustre's configure has no Debian case, so the kernel gets the
  # vanilla ldiskfs-6.12-ml series.  Pinned to 6.12.107: from 6.12.111
  # that series' ext4-filename-encode.patch no longer applies.
  debian13:
    container_image: docker.io/library/debian:13
    kernel_deb_source: linux-source-6.12=6.12.107-1
    kernels:
      available:
      - 6.12-debian13
      config:
        CONFIG_LOCALVERSION: '"-lustre"'
      default: 6.12-debian13
    lustre:
      mode: server_ldiskfs
    os_family: debian
    os_name: debian
    os_version: '13'
    status: experimental
